<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Admin - Tralala Machinery & Paint</title>

    <!-- SEO Meta Tags -->
    <meta name="description" content="Tralala Machinery & Paint - Bengkel motor dan mobil terpercaya. Pelayanan profesional, cat ulang, servis mesin, dan reparasi.">
    <meta name="keywords" content="bengkel, servis mobil, servis motor, cat ulang, ganti oli, bengkel terdekat, Tralala">
    <meta name="author" content="Erwin Eka Pratama">
    <meta name="robots" content="index, follow">
    <link rel="canonical" href="http://127.0.0.1:5000/">

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <style>
        body {
            background-color: var(--krem);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .login-card {
            max-width: 400px;
            width: 100%;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }
    </style>
</head>
<body>

    <div class="card login-card border-0 p-4">
        <div class="text-center mb-4">
            <div class="bg-danger text-white rounded p-2 d-inline-flex align-items-center justify-content-center mb-3" style="width:50px;height:50px;">
                <i class="bi bi-wrench-adjustable fs-3"></i>
            </div>
            <h4 class="fw-black text-dark">TRALALA LOGIN</h4>
            <p class="text-muted small">Silakan masuk ke akun Anda</p>
        </div>

        {% if error %}
        <div class="alert alert-danger text-center small py-2">{{ error }}</div>
        {% endif %}

        <form action="/login" method="POST">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
            <div class="mb-3">
                <label class="form-label fw-bold text-dark small">Email Address</label>
                <div class="input-group">
                    <span class="input-group-text bg-light"><i class="bi bi-envelope"></i></span>
                    <input type="email" name="email" class="form-control bg-light" required>
                </div>
            </div>
            <div class="mb-4">
                <label class="form-label fw-bold text-dark small">Password</label>
                <div class="input-group">
                    <span class="input-group-text bg-light"><i class="bi bi-lock"></i></span>
                    <input type="password" name="password" class="form-control bg-light" required>
                </div>
            </div>
            <button type="submit" class="btn btn-primary-custom w-100 fw-bold py-2 rounded-3">Login</button>
            <div class="text-center mt-3">
                <small class="text-muted">Belum punya akun? <a href="/register" class="text-danger fw-bold text-decoration-none">Daftar Pelanggan</a></small>
            </div>
            <a href="/" class="btn btn-outline-secondary w-100 fw-bold py-2 rounded-3 mt-3">Kembali ke Web</a>
        </form>
    </div>



</body>

</html>
